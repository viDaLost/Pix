<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Гравюры · лаборатория</title>
<!-- The workbench of the engraver (art.md 5.5): every plate at every stage side by side, or one plate large with the
     coordinate grid of its field and its anchors. Not part of the game: not cached by sw.js, not copied to dist.
     ?id=werewolf&stage=3&grid=1&w=720 · ?w=300 (all plates) · ?stages=1,3 · ?time=1 (render times) -->
<style>
 :root{color-scheme:dark;--bg:#120e0b;--text:#f1e6cf;--muted:#a3967e;--line:rgba(226,194,138,.2)}
 body{margin:0;padding:16px;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,sans-serif}
 h1{font:700 22px Georgia,serif;margin:0 0 4px}p{margin:0 0 12px;color:var(--muted)}a{color:#d6ad66}
 .grid{display:grid;grid-template-columns:repeat(var(--cols),max-content);gap:14px 12px;align-items:start}
 figure{margin:0;display:flex;flex-direction:column;gap:4px}figcaption{font-size:12px;color:var(--muted)}figcaption b{color:var(--text)}
 canvas{display:block;border-radius:2px;box-shadow:0 0 0 1px var(--line)}
 .one{position:relative;display:inline-block}.one canvas.grid{position:absolute;inset:0;box-shadow:none;pointer-events:none}
 .row-head{grid-column:1/-1;font:700 16px Georgia,serif;margin-top:6px;border-top:1px solid var(--line);padding-top:8px}
</style>
</head>
<body>
<main id="lab"></main>
<script type="module">
import {renderPlate,thumbURL,compile,drawPlate,STAGES,PW,PH,anchorsOf} from '../src/engraving.js';
import {PLATES} from '../src/plates.js';
import {MONSTERS} from '../src/content-data.js';
const q=new URLSearchParams(location.search),lab=document.getElementById('lab'),dpr=Math.min(2,devicePixelRatio||1);
const ids=MONSTERS.map(m=>m.id),cap=id=>{const m=MONSTERS.find(m=>m.id===id);return `Табл. ${m.plate.table} · ${m.plate.title} — ${m.name}`;};
const time=fn=>{const t=performance.now();const r=fn();return [r,performance.now()-t];};
function one(id,stage,w){const box=document.createElement('div');box.className='one';const [cv,ms]=time(()=>renderPlate(id,stage,w,dpr));cv.style.width=w+'px';box.append(cv);
 if(q.get('grid')){const g=document.createElement('canvas');g.className='grid';g.width=cv.width;g.height=cv.height;g.style.width=w+'px';const c=g.getContext('2d'),k=g.width/PW;c.scale(k,k);
  for(let x=0;x<=PW;x+=10){c.strokeStyle=x%50?'rgba(40,90,160,.18)':'rgba(40,90,160,.5)';c.lineWidth=1/k;c.beginPath();c.moveTo(x,0);c.lineTo(x,PH);c.stroke();}
  for(let y=0;y<=PH;y+=10){c.strokeStyle=y%50?'rgba(40,90,160,.18)':'rgba(40,90,160,.5)';c.beginPath();c.moveTo(0,y);c.lineTo(PW,y);c.stroke();}
  c.fillStyle='rgba(20,60,140,.85)';c.font=`${12/k*1.6}px system-ui`;for(let x=0;x<PW;x+=20)c.fillText(x,x+.5,5);for(let y=20;y<PH;y+=20)c.fillText(y,.5,y-.5);
  for(const [cat,[x,y]] of Object.entries(anchorsOf(id)||{})){c.strokeStyle='#b0301c';c.lineWidth=1.2/k*2;c.beginPath();c.arc(x,y,5,0,7);c.stroke();c.fillStyle='#b0301c';c.fillText({substance:'С',ward:'О',time:'В',place:'М',ritual:'Р'}[cat],x+6,y-5);}
  box.append(g);}
 return [box,ms];}
const fig=(el,text)=>{const f=document.createElement('figure');f.append(el);const c=document.createElement('figcaption');c.innerHTML=text;f.append(c);return f;};
const id=q.get('id');
if(id){const st=q.has('stage')?(q.get('stage')==='-'?null:+q.get('stage')):3,w=+q.get('w')||720;const [box,ms]=one(id,st,w);
 lab.innerHTML=`<h1>${cap(id)}</h1><p>Стадия ${st==null?'силуэт':st+' · '+STAGES[st]} · ${ms.toFixed(1)} мс · <a href="?">все таблицы</a></p>`;lab.append(box);
 const n=drawPlate({save(){},restore(){},beginPath(){},closePath(){},moveTo(){},lineTo(){},quadraticCurveTo(){},bezierCurveTo(){},arc(){},rect(){},clip(){},fill(){},stroke(){},fillRect(){}},id,st??3);
 lab.insertAdjacentHTML('beforeend',`<p>Вызовов stroke: ${n?.strokes} · штрихов штриховки: ${n?.hatch} · фигур: ${n?.shapes} · данных ${JSON.stringify(PLATES[id]).length} Б</p>`);}
else{const w=+q.get('w')||240,stages=(q.get('stages')||'-,0,1,2,3,4').split(',').map(s=>s==='-'?null:+s),list=(q.get('ids')||'').split(',').filter(Boolean),show=list.length?list:ids.filter(i=>PLATES[i]);
 lab.innerHTML=`<h1>Гравюры бестиария</h1><p>${show.length} из ${ids.length} таблиц · ширина ${w} · dpr ${dpr}</p>`;const grid=document.createElement('div');grid.className='grid';grid.style.setProperty('--cols',stages.length+1);lab.append(grid);
 for(const i of show){const h=document.createElement('div');h.className='row-head';h.innerHTML=`<a href="?id=${i}&grid=1">${cap(i)}</a>`;grid.append(h);
  for(const st of stages){const [box,ms]=one(i,st,w);grid.append(fig(box,`<b>${st==null?'силуэт':st}</b> ${st==null?'':STAGES[st]} · ${ms.toFixed(1)} мс`));}
  const im=new Image();im.src=thumbURL(i,3);im.width=64;im.height=48;grid.append(fig(im,'миниатюра'));}}
</script>
</body></html>
